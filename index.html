<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MokTrak</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;overflow:hidden;font-family:system-ui,sans-serif;height:100vh}
#wrap{position:relative;width:100vw;height:100vh}
#video,#overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#overlay{z-index:2;pointer-events:none}
#hud{position:absolute;top:12px;right:12px;color:#00ff88;font:600 14px monospace;background:rgba(0,0,0,.6);padding:8px 14px;border-radius:20px;z-index:5}
#fps{position:absolute;top:12px;left:12px;color:#00ff88;font:600 12px monospace;background:rgba(0,0,0,.6);padding:6px 10px;border-radius:12px;z-index:5}
#startBtn{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);padding:18px 50px;font-size:18px;font-weight:700;background:#00ff88;color:#000;border:none;border-radius:40px;z-index:10;box-shadow:0 8px 32px rgba(0,255,136,.5)}
#startBtn:active{transform:translateX(-50%) scale(.96)}
</style>
</head>
<body>
<div id="wrap">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="overlay"></canvas>
  <div id="hud">MokTrak · جاهز</div>
  <div id="fps">-- fps</div>
  <button id="startBtn">▶ تشغيل الكاميرا</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
(()=>{
const MAX_OBJECTS=2, SCORE_MIN=0.40, SMOOTHING=0.65, LOST_TIMEOUT=400, IOU_MIN=0.20;
const video=document.getElementById('video'),canvas=document.getElementById('overlay');
const ctx=canvas.getContext('2d'),hud=document.getElementById('hud');
const fpsEl=document.getElementById('fps'),startBtn=document.getElementById('startBtn');
let model=null,running=false,nextId=1,tracks=[],lastFps=performance.now(),fpsCount=0;

const iou=(a,b)=>{const x1=Math.max(a[0],b[0]),y1=Math.max(a[1],b[1]),x2=Math.min(a[0]+a[2],b[0]+b[2]),y2=Math.min(a[1]+a[3],b[1]+b[3]);const i=Math.max(0,x2-x1)*Math.max(0,y2-y1),u=a[2]*a[3]+b[2]*b[3]-i;return u>0?i/u:0};
const smooth=(p,n)=>{const a=SMOOTHING,b=1-SMOOTHING;return[p[0]*a+n[0]*b,p[1]*a+n[1]*b,p[2]*a+n[2]*b,p[3]*a+n[3]*b]};

async function start(){
  startBtn.disabled=true;hud.textContent='تحميل الموديل…';
  try{
    model=await cocoSsd.load({base:'lite_mobilenet_v2'});
    hud.textContent='تشغيل الكاميرا…';
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:480}},audio:false});
    video.srcObject=stream;
    await new Promise(r=>{video.onloadedmetadata=r});
    await video.play();
    canvas.width=video.videoWidth;canvas.height=video.videoHeight;
    startBtn.style.display='none';hud.textContent='MokTrak · يعمل';
    running=true;loop();
  }catch(e){
    hud.textContent='خطأ: '+e.message;
    startBtn.disabled=false;startBtn.textContent='↻ إعادة المحاولة';
  }
}

async function loop(){
  if(!running)return;
  const now=performance.now();fpsCount++;
  if(now-lastFps>=1000){fpsEl.textContent=fpsCount+' fps';fpsCount=0;lastFps=now}
  let preds=[];try{preds=await model.detect(video,10,SCORE_MIN)}catch(_){}
  const dets=preds.map(p=>({label:p.class,score:p.score,box:p.bbox,area:p.bbox[2]*p.bbox[3]}))
    .sort((a,b)=>b.area-a.area).slice(0,MAX_OBJECTS);
  const used=new Array(tracks.length).fill(false),fresh=[];
  for(const d of dets){
    let bi=-1,biou=IOU_MIN;
    for(let i=0;i<tracks.length;i++){if(used[i])continue;const v=iou(tracks[i].box,d.box);if(v>biou){biou=v;bi=i}}
    if(bi>=0){used[bi]=true;const t=tracks[bi];fresh.push({id:t.id,box:smooth(t.box,d.box),label:d.label,score:d.score,lastSeen:now})}
    else fresh.push({id:nextId++,box:[...d.box],label:d.label,score:d.score,lastSeen:now});
  }
  for(let i=0;i<tracks.length;i++){if(!used[i]&&now-tracks[i].lastSeen<LOST_TIMEOUT)fresh.push(tracks[i])}
  tracks=fresh;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const t of tracks){
    const[x,y,w,h]=t.box;
    ctx.strokeStyle='#00ff88';ctx.lineWidth=5;ctx.shadowColor='#00ff88';ctx.shadowBlur=12;
    ctx.strokeRect(x,y,w,h);ctx.shadowBlur=0;
    const cl=Math.min(w,h)*0.15;ctx.lineWidth=7;ctx.beginPath();
    ctx.moveTo(x,y+cl);ctx.lineTo(x,y);ctx.lineTo(x+cl,y);
    ctx.moveTo(x+w-cl,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w,y+cl);
    ctx.moveTo(x+w,y+h-cl);ctx.lineTo(x+w,y+h);ctx.lineTo(x+w-cl,y+h);
    ctx.moveTo(x+cl,y+h);ctx.lineTo(x,y+h);ctx.lineTo(x,y+h-cl);ctx.stroke();
    const text=`#${t.id} ${t.label} ${(t.score*100).toFixed(0)}%`;
    ctx.font='bold 16px monospace';const tw=ctx.measureText(text).width;
    ctx.fillStyle='#00ff88';ctx.fillRect(x,y-26,tw+14,26);
    ctx.fillStyle='#000';ctx.fillText(text,x+7,y-8);
  }
  requestAnimationFrame(loop);
}
startBtn.addEventListener('click',start);
})();
</script>
</body>
</html>
